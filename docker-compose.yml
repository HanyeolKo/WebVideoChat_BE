services:
  app:
    # GHCR에 push된 이미지를 pull하여 사용한다(서버는 빌드하지 않음).
    # 롤백: 서버에서 IMAGE_TAG=<이전태그> docker compose up -d 로 특정 버전으로 되돌릴 수 있다.
    image: ghcr.io/hanyeolko/webvideochat-be:${IMAGE_TAG:-latest}
    container_name: webvideochat-app
    restart: always
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - webnet

  nginx:
    image: nginx:1.27-alpine
    container_name: webvideochat-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
