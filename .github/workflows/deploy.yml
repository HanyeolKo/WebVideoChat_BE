name: CI/CD Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build All Services
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all services
        run: ./gradlew clean build -x test

      - name: Copy JARs to deploy directory
        run: |
          mkdir -p deploy/config-server deploy/discovery-server deploy/api-gateway \
                   deploy/room-service deploy/signaling-service
          cp config-server/build/libs/*.jar    deploy/config-server/app.jar
          cp discovery-server/build/libs/*.jar deploy/discovery-server/app.jar
          cp api-gateway/build/libs/*.jar      deploy/api-gateway/app.jar
          cp room-service/build/libs/*.jar     deploy/room-service/app.jar
          cp signaling-service/build/libs/*.jar deploy/signaling-service/app.jar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: deploy/
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout (for deploy config files)
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: deploy/

      - name: Organize deploy structure
        run: |
          cp config-server/Dockerfile    deploy/config-server/Dockerfile
          cp discovery-server/Dockerfile deploy/discovery-server/Dockerfile
          cp api-gateway/Dockerfile      deploy/api-gateway/Dockerfile
          cp room-service/Dockerfile     deploy/room-service/Dockerfile
          cp signaling-service/Dockerfile deploy/signaling-service/Dockerfile
          cp docker-compose.yml          deploy/docker-compose.yml
          mkdir -p deploy/nginx
          cp nginx/nginx.conf            deploy/nginx/nginx.conf

      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy/"
          target: "/home/deploy/webVideoChat/back-end"
          strip_components: 1

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/deploy/webVideoChat/back-end
            echo "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" > .env
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            sleep 10
            docker compose ps
